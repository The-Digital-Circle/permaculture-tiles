seed = 7
zoom_min = 0
zoom_max = 8
tile_size = 256
pad = 24
workers = 10
data_dir = "data"
out_dir = "build/tiles"
scratch_dir = "build/scratch"
pmtiles_cap = 1900000000
attribution = "Natural Earth"

paper_tex_size = 1024
paper_cells = 16
paper_octaves = 4
ocean_cells = 8
ocean_octaves = 3
ocean_contrast = 0.4

[render]
coast_sigma = 1.6
disp_amp = 0.9
edge_px = 6.0
edge_strength = 0.5
river_px = 1
river_alpha = 0.22
speckle_alpha = 0.0
speckle_thresh = 0.985
lake_min_zoom = 4
river_min_zoom = 6
min_area_px = 3.0
coast_all_touched = true

# Optional real watercolour swatches (built by scripts/make_swatches.py). Absent => procedural.
[textures]
# paper = "assets/textures/paper.png"
# granulation = "assets/textures/granulation.png"

# Palette sampled from the perma.earth footer watercolour (ILUSTRA-12-HOME.jpg):
# sage-green living land, warm peach arid earth, soft teal sea, cream paper. Coral accent reserved.
[palette]
land    = "#a9b89a"
arid    = "#e9c39c"
sea     = "#8fc6c0"
lake    = "#a7d2c9"
river   = "#93c6bf"
paper   = "#f5efe2"
speckle = "#ffffff"
accent  = "#e07a5f"
